name: Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional image tag (e.g. v1.2.3)"
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      # ---------------------------
      # Checkout
      # ---------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ---------------------------
      # Setup QEMU (multi-arch)
      # ---------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # ---------------------------
      # Setup Buildx
      # ---------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ---------------------------
      # Login to GHCR
      # ---------------------------
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------
      # Docker metadata (FIXED)
      # ---------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Explicit tag from workflow_dispatch input
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}

            # Git tag semver (v1.2.3 -> 1.2.3)
            type=semver,pattern={{version}}

            # latest only on main branch
            type=raw,value=latest,enable={{is_default_branch}}

            # always-safe fallback (prevents empty tag error)
            type=sha

      # ---------------------------
      # Build + push multi-arch
      # ---------------------------
      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/386
          # NEVER empty because of fallback sha tag
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Optional but recommended caching
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------
      # Attestation (digest-based)
      # ---------------------------
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
